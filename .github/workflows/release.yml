# 배포 파일 두 개를 만들어 GitHub Releases에 초안으로 올린다.
#   pygaki-<태그>-renpy-<버전>.zip  렌파이 SDK까지 든 묶음 (풀고 renpy.exe)
#   pygaki-<태그>-addon.zip         이미 있는 렌파이 SDK 폴더에 넣는 덧붙임
# 태그(v1.0 같은)를 올리면 돈다. 초안은 Releases에서 보고 [Publish]를 눌러야 공개된다.
# 손으로 돌리면(workflow_dispatch) Releases에는 안 올리고 Artifacts에만 남긴다.
name: 배포 파일

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RENPY_VERSION: 8.5.3

jobs:
  app:
    uses: ./.github/workflows/app.yml

  bundle:
    needs: app
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pygaki-win
          path: pygaki-win

      - name: 렌파이 SDK 받기
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: renpy-${{ env.RENPY_VERSION }}-sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}
      - if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o sdk.zip "https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.zip"
          7z x -y sdk.zip > /dev/null
          rm sdk.zip
          test -f "renpy-$RENPY_VERSION-sdk/renpy.exe"

      - name: 묶기
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
        run: python bundle/make_bundle.py --sdk "renpy-$RENPY_VERSION-sdk" --app pygaki-win --out out --tag "$TAG" --zip

      - name: 묶은 것 확인 (템플릿으로 만든 프로젝트 Lint)
        shell: bash
        run: |
          B="out/pygaki-$TAG-renpy-$RENPY_VERSION"
          cp -r "$B/showpy" lintproj && rm lintproj/project.json
          "$B/lib/py3-windows-x86_64/python.exe" "$B/renpy.py" lintproj lint | tail -5
          "$B/lib/py3-windows-x86_64/python.exe" "$B/renpy.py" "$B/launcher" lint > /dev/null
          test -f "$B/launcher/game/pygaki_launcher.rpyc"

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pygaki-dev
          path: out/*.zip
          compression-level: 0

      - name: Releases에 초안 올리기
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## 어떤 것을 받나요?

          - **렌파이가 아직 없으면** → \`pygaki-$TAG-renpy-$RENPY_VERSION.zip\`
            아무 폴더에 풀고 \`renpy.exe\`를 켜면 됩니다. 렌파이 $RENPY_VERSION + showpy + pygaki 앱이 다 들어 있습니다.
          - **렌파이 SDK가 이미 있으면** → \`pygaki-$TAG-addon.zip\`
            zip 안의 \`launcher\`, \`showpy\`, \`pygaki\` 세 폴더를 렌파이 SDK 폴더(\`renpy.exe\`가 있는 곳)에 끌어 넣고 런처를 껐다 켭니다. 렌파이의 원래 파일은 바뀌지 않습니다.

          런처 첫 화면 아래쪽에 **[pygaki로 편집]** 버튼이 생기고, 새 프로젝트 만들기에서 **기본 (Vanilla)** 과 **Pygaki** 를 고를 수 있습니다. 자세한 쓰는 법은 묶음 안의 \`pygaki/읽어주세요.txt\`.

          pygaki 앱은 서명이 없어서 처음 켤 때 윈도우가 "PC 보호" 창을 띄울 수 있습니다. [추가 정보] → [실행]을 누릅니다.

          웹 버전 pygaki(설치 없이, 대본 편집만): https://halftomatodev.github.io/pygaki/
          EOF
          gh release create "$TAG" out/*.zip --draft --title "pygaki $TAG" --notes-file notes.md
