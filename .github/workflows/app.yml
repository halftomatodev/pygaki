# pygaki 데스크톱 앱: 리눅스에서 진짜 Electron으로 켜서 확인하고, 윈도우용 pygaki.exe 폴더를 만든다.
# 결과물 "pygaki-win"을 받아 풀고 bundle/make_bundle.py --app 으로 그 폴더를 주면 배포 묶음이 된다.
name: pygaki 앱

on:
  push:
    branches: [main, 'claude/**']
    paths: ['pykaki/**', 'showpy/game/ui_kit/engine/text_effects.glsl', 'showpy/game/ui_kit/effects/**', 'showpy/effects_library/**', '.github/workflows/app.yml']
  workflow_dispatch:
  workflow_call:    # release.yml이 불러서 씀

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pykaki/package-lock.json
            pykaki/app/package-lock.json
      - run: npm ci
        working-directory: pykaki
      - run: npm run build
        working-directory: pykaki
      - run: npm ci
        working-directory: pykaki/app
      - run: npm run web
        working-directory: pykaki/app
      - run: npm install --no-save playwright@1.48.2
        working-directory: pykaki/app
      - run: xvfb-run --auto-servernum node smoke.cjs
        working-directory: pykaki/app

  windows:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pykaki/package-lock.json
            pykaki/app/package-lock.json
      - run: npm ci
        working-directory: pykaki
      - run: npm run build
        working-directory: pykaki
      - run: npm ci
        working-directory: pykaki/app
      - run: npm run dist
        working-directory: pykaki/app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pygaki-win
          path: pykaki/app/out/win-unpacked
